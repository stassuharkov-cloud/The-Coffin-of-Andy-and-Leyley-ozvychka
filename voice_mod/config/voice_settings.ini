# Настройки озвучки для The Coffin of Andy and Leyley

[general]
enabled=true
volume_db=0.0
audio_folder="voice_mod/audio/"
supported_extensions=["flac", "ogg", "wav", "mp3"]
cache_enabled=true

[characters]
# Маппинг имен персонажей в имена файлов
andy=["andy", "энди", "andrew", "эндру"]
leyley=["leyley", "лейли", "leyla", "лейла", "ashley", "эштли"]

[behavior]
# Режимы воспроизведения
# - immediate: воспроизводить сразу при появлении текста
# - wait: ждать окончания предыдущей фразы
# - queue: ставить в очередь
playback_mode="queue"

# Что делать при клике во время воспроизведения
# - stop: остановить голос
# - wait: дождаться окончания
# - ignore: игнорировать клик
on_click_behavior="stop"

# Автоматическое создание имен файлов
auto_filename=true
filename_format="{character}_{text}"  # {character}, {text}, {chapter}, {scene}

[debug]
log_enabled=true
show_notifications=false
